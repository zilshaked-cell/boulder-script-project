<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <?!= include_("UiTheme"); ?>
    <style>
      body.boulder-dialog {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg-page);
        color: var(--text-primary);
      }

      #dialog-root {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: linear-gradient(145deg, #ffffff, #eef3fb);
      }

      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.94),
          rgba(255, 255, 255, 0.86)
        );
        border-bottom: 1px solid var(--border-subtle);
        gap: 8px;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .dialog-title {
        font-weight: 800;
        font-size: 16px;
      }

      .dialog-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .dialog-body {
        flex: 1;
        padding: 16px;
        box-sizing: border-box;
        overflow: auto;
        background: rgba(255, 255, 255, 0.9);
      }

      .compact .dialog-body {
        padding: 10px;
        font-size: 13px;
      }

      .dialog-errors {
        background: color-mix(in srgb, var(--danger) 12%, #fff);
        border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
        color: #7a1d1d;
        padding: 10px;
        margin-bottom: 12px;
        border-radius: var(--radius-md);
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
        color: var(--text-primary);
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 9px 10px;
        box-sizing: border-box;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        font-size: 14px;
        background: rgba(255, 255, 255, 0.96);
        color: var(--text-primary);
      }

      .jobs-section {
        margin-top: 16px;
        border-top: 1px solid var(--border-subtle);
        padding-top: 12px;
      }

      .jobs-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .jobs-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .job-row {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 10px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow-soft);
      }

      .job-row-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .job-row-title {
        font-weight: 700;
      }

      .job-active-toggle {
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      .job-active-toggle.inactive {
        background: rgba(15, 23, 42, 0.05);
        color: var(--text-muted);
      }

      .job-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px 12px;
      }

      .dialog-footer-actions {
        margin-top: 16px;
        display: flex;
        gap: 8px;
      }

      .placeholder {
        color: var(--text-muted);
      }

      .filters-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .filters-row .field {
        min-width: 160px;
        flex: 1;
      }

      table.shifts-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 14px;
      }

      table.shifts-table th,
      table.shifts-table td {
        border: 1px solid var(--border-subtle);
        padding: 8px;
        font-size: 13px;
        text-align: right;
      }

      table.shifts-table th {
        background: rgba(255, 255, 255, 0.86);
        font-weight: 600;
      }

      table.shifts-table tr:hover {
        background: color-mix(in srgb, var(--accent) 10%, #fff);
        cursor: pointer;
      }

      .shifts-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
      }

      .shifts-form {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 12px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow-soft);
      }

      .shifts-form .field textarea {
        width: 100%;
        min-height: 70px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        font-size: 14px;
      }
    </style>
  </head>
  <body class="boulder-dialog">
    <div id="dialog-root" data-mode="<?= mode ?>" dir="rtl">
      <div id="dialog-header"></div>
      <div id="dialog-body">
        <div class="placeholder">טוען נתונים...</div>
      </div>
    </div>

    <script>
      (function () {
        // Params arrive from the server as a JSON literal string. Embed it safely and
        // support both string and object forms to be robust to template changes.
        var _DIALOG_PARAMS_RAW = <?= paramsJson ?> || {};
        if (typeof _DIALOG_PARAMS_RAW === "string") {
          try {
            _DIALOG_PARAMS_RAW = JSON.parse(_DIALOG_PARAMS_RAW);
          } catch (_e) {
            _DIALOG_PARAMS_RAW = {};
          }
        }

        window.DIALOG_PARAMS =
          _DIALOG_PARAMS_RAW && typeof _DIALOG_PARAMS_RAW === "object"
            ? _DIALOG_PARAMS_RAW
            : {};

        var rootEl = document.getElementById("dialog-root");
        var dialogState = {
          mode: rootEl ? rootEl.getAttribute("data-mode") : "",
          params: window.DIALOG_PARAMS || {},
          lastResponse: null,
          isCompact: false,
        };

        var requestsState = {
          filters: {},
          requests: [],
          employees: [],
          statuses: [],
          requestTypes: [],
          rules: {},
          selectedId: "",
          selection: {},
          canEdit: false,
          message: "",
        };

        window.addEventListener("load", initExtendedDialog);

        function initExtendedDialog() {
          attachHeaderButtons();
          loadDialogData();
        }

        function attachHeaderButtons() {
          var header = document.getElementById("dialog-header");
          if (!header) return;

          header.innerHTML = "";

          var title = document.createElement("div");
          title.className = "dialog-title";
          title.textContent = getDialogTitle();

          var actions = document.createElement("div");
          actions.className = "dialog-actions";

          var refreshBtn = document.createElement("button");
          refreshBtn.type = "button";
          refreshBtn.textContent = "רענן";
          refreshBtn.onclick = function () {
            loadDialogData();
          };

          var compactBtn = document.createElement("button");
          compactBtn.type = "button";
          compactBtn.textContent = dialogState.isCompact
            ? "מצב מלא"
            : "מצב קומפקטי";
          compactBtn.onclick = function () {
            toggleCompactMode();
          };

          var closeBtn = document.createElement("button");
          closeBtn.type = "button";
          closeBtn.textContent = "✕";
          closeBtn.onclick = function () {
            google.script.host.close();
          };

          actions.appendChild(refreshBtn);
          actions.appendChild(compactBtn);
          actions.appendChild(closeBtn);

          header.appendChild(title);
          header.appendChild(actions);
        }

        function getDialogTitle() {
          switch (dialogState.mode) {
            case "employee":
              return "כרטיס עובד";
            case "shifts":
              return "משמרות";
            case "requests":
              return "בקשות";
            default:
              return "בולדר – חלון מורחב";
          }
        }

        function toggleCompactMode() {
          dialogState.isCompact = !dialogState.isCompact;
          if (rootEl) {
            if (dialogState.isCompact) {
              rootEl.classList.add("compact");
            } else {
              rootEl.classList.remove("compact");
            }
          }
          attachHeaderButtons();
        }

        function loadDialogData() {
          if (dialogState.mode === "employee") {
            loadEmployeeDialogData();
          } else if (dialogState.mode === "shifts") {
            loadShiftsDialogData();
          } else if (dialogState.mode === "requests") {
            loadRequestsDialogData();
          } else {
            renderError("מצב דיאלוג לא ידוע: " + dialogState.mode);
          }
        }

        function loadEmployeeDialogData() {
          var params = dialogState.params || {};
          if (!params.employeeId) {
            renderError("לא נבחר עובד להצגה.");
            return;
          }

          setBodyLoading("טוען נתוני עובד...");

          google.script.run
            .withFailureHandler(function (err) {
              renderError("שגיאה בטעינת כרטיס העובד: " + err);
            })
            .withSuccessHandler(function (response) {
              dialogState.lastResponse = response || null;
              renderEmployeeView(response || {});
            })
            .UI_getEmployeeDialogData({
              employeeId: String(params.employeeId),
            });
        }

        function renderEmployeeView(response) {
          var body = document.getElementById("dialog-body");
          if (!body) return;
          body.innerHTML = "";

          var errors = (response && response.errors) || [];
          var data = (response && response.data) || {};
          var employee = data.employee || null;
          var employeeJobs = data.employeeJobs || [];
          var allJobTypes = data.allJobTypes || [];

          if (errors.length) {
            var errBox = document.createElement("div");
            errBox.className = "dialog-errors";
            errors.forEach(function (err) {
              var line = document.createElement("div");
              line.textContent = err && err.message ? err.message : String(err);
              errBox.appendChild(line);
            });
            body.appendChild(errBox);
          }

          if (!employee) {
            var info = document.createElement("div");
            info.className = "placeholder";
            info.textContent = "לא נמצאו נתוני עובד.";
            body.appendChild(info);
            return;
          }

          var form = document.createElement("form");
          form.id = "employee-form";
          form.onsubmit = function (e) {
            e.preventDefault();
            saveEmployeeFromForm();
          };

          form.appendChild(
            createLabeledInput(
              "שם מלא",
              "employee-name",
              employee.name || "",
              true
            )
          );
          form.appendChild(
            createLabeledInput(
              "אימייל",
              "employee-email",
              employee.email || "",
              false
            )
          );
          form.appendChild(
            createLabeledInput(
              "טלפון",
              "employee-phone",
              employee.phone || "",
              false
            )
          );
          form.appendChild(
            createLabeledInput(
              "ת.ז",
              "employee-idnum",
              employee.idNumber || employee.teudatZehut || "",
              false
            )
          );
          form.appendChild(
            createLabeledInput(
              "מין",
              "employee-gender",
              employee.gender || "",
              false
            )
          );
          form.appendChild(
            createLabeledInput(
              "תאריך לידה",
              "employee-birthdate",
              employee.birthdate || "",
              false
            )
          );
          form.appendChild(
            createLabeledInput(
              "מידת חולצה",
              "employee-shirt",
              employee.shirtSize || "",
              false
            )
          );
          form.appendChild(
            createLabeledInput(
              "עלות החזרי נסיעות יומי",
              "employee-travel",
              employee.travelCost || "",
              false
            )
          );

          var jobsSection = document.createElement("div");
          jobsSection.className = "jobs-section";

          var jobsHeader = document.createElement("div");
          jobsHeader.className = "jobs-header";

          var jobsTitle = document.createElement("div");
          jobsTitle.textContent = "סוגי עבודה משויכים";

          var addJobBtn = document.createElement("button");
          addJobBtn.type = "button";
          addJobBtn.textContent = "הוסף שורה";
          addJobBtn.onclick = function () {
            appendJobRow(jobsList, {}, allJobTypes);
          };

          jobsHeader.appendChild(jobsTitle);
          jobsHeader.appendChild(addJobBtn);
          jobsSection.appendChild(jobsHeader);

          var jobsList = document.createElement("div");
          jobsList.className = "jobs-list";
          var rowsToRender =
            employeeJobs && employeeJobs.length
              ? employeeJobs
              : [
                  {
                    active: true,
                    jobType: "",
                    department: "",
                    amount: "",
                    paymentMode: "",
                    notes: "",
                  },
                ];
          rowsToRender.forEach(function (job) {
            appendJobRow(jobsList, job, allJobTypes);
          });
          jobsSection.appendChild(jobsList);
          form.appendChild(jobsSection);

          var hiddenId = document.createElement("input");
          hiddenId.type = "hidden";
          hiddenId.id = "employee-id";
          hiddenId.value = employee.id || "";
          form.appendChild(hiddenId);

          var actions = document.createElement("div");
          actions.className = "dialog-footer-actions";

          var saveBtn = document.createElement("button");
          saveBtn.type = "submit";
          saveBtn.textContent = "שמור";

          var cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.textContent = "סגור";
          cancelBtn.onclick = function () {
            google.script.host.close();
          };

          actions.appendChild(saveBtn);
          actions.appendChild(cancelBtn);
          form.appendChild(actions);

          body.appendChild(form);
        }

        function createLabeledInput(labelText, inputId, value, required) {
          var wrapper = document.createElement("div");
          wrapper.className = "field";

          var label = document.createElement("label");
          label.htmlFor = inputId;
          label.textContent = labelText;

          var input = document.createElement("input");
          input.id = inputId;
          input.type = "text";
          input.value = value || "";
          if (required) {
            input.required = true;
          }

          wrapper.appendChild(label);
          wrapper.appendChild(input);
          return wrapper;
        }

        function appendJobRow(container, job, allJobTypes) {
          if (!container) return;
          var row = document.createElement("div");
          row.className = "job-row";
          row.setAttribute("data-row-index", job.rowIndex || "");

          var header = document.createElement("div");
          header.className = "job-row-header";

          var title = document.createElement("span");
          title.className = "job-row-title";
          title.textContent = job.jobType || "סוג עבודה";

          var activeBtn = document.createElement("button");
          activeBtn.type = "button";
          activeBtn.className = "job-active-toggle";
          setActiveButton(
            activeBtn,
            job.active !== false && job.rowActive !== false
          );
          activeBtn.onclick = function () {
            var nowActive = activeBtn.getAttribute("data-active") === "true";
            setActiveButton(activeBtn, !nowActive);
          };

          header.appendChild(title);
          header.appendChild(activeBtn);
          row.appendChild(header);

          var grid = document.createElement("div");
          grid.className = "job-grid";

          var jobSelect = document.createElement("select");
          jobSelect.className = "job-type";
          var optEmpty = document.createElement("option");
          optEmpty.value = "";
          optEmpty.textContent = "-- בחר סוג עבודה --";
          jobSelect.appendChild(optEmpty);

          var matched = false;
          allJobTypes.forEach(function (j) {
            var opt = document.createElement("option");
            opt.value = j.name || "";
            opt.textContent = j.name || "";
            if (job.jobType && j.name === job.jobType) {
              opt.selected = true;
              matched = true;
            }
            if (j.isActive === false) {
              opt.textContent += " (לא פעיל)";
            }
            jobSelect.appendChild(opt);
          });

          if (job.jobType && !matched) {
            var customOpt = document.createElement("option");
            customOpt.value = job.jobType;
            customOpt.textContent = job.jobType + " (לא בטבלת אופציות)";
            customOpt.selected = true;
            jobSelect.insertBefore(customOpt, jobSelect.children[1] || null);
          }

          var deptInput = document.createElement("input");
          deptInput.className = "job-department";
          deptInput.type = "text";
          deptInput.value = job.department || "";

          jobSelect.addEventListener("change", function () {
            var selectedName = jobSelect.value || "";
            var matchedJob = allJobTypes.find(function (j) {
              return j.name === selectedName;
            });
            title.textContent = selectedName || "סוג עבודה";
            if (matchedJob && matchedJob.department) {
              deptInput.value = matchedJob.department;
            }
          });

          var amountInput = document.createElement("input");
          amountInput.className = "job-amount";
          amountInput.type = "number";
          amountInput.value = job.amount || "";

          var paymentInput = document.createElement("input");
          paymentInput.className = "job-payment";
          paymentInput.type = "text";
          paymentInput.value = job.paymentMode || "";

          var notesInput = document.createElement("input");
          notesInput.className = "job-notes";
          notesInput.type = "text";
          notesInput.value = job.notes || "";

          grid.appendChild(wrapField("סוג עבודה", jobSelect));
          grid.appendChild(wrapField("מחלקה", deptInput));
          grid.appendChild(wrapField("סכום", amountInput));
          grid.appendChild(wrapField("אופן תשלום", paymentInput));
          grid.appendChild(wrapField("הערות", notesInput));

          row.appendChild(grid);
          container.appendChild(row);
        }

        function wrapField(labelText, element) {
          var wrap = document.createElement("div");
          wrap.className = "field";
          var label = document.createElement("label");
          label.textContent = labelText;
          wrap.appendChild(label);
          wrap.appendChild(element);
          return wrap;
        }

        function setActiveButton(btn, isActive) {
          btn.setAttribute("data-active", isActive ? "true" : "false");
          btn.textContent = isActive ? "פעיל" : "לא פעיל";
          btn.classList.toggle("inactive", !isActive);
        }

        function saveEmployeeFromForm() {
          var idEl = document.getElementById("employee-id");
          if (!idEl || !idEl.value) {
            alert("חסר מזהה עובד – אי אפשר לשמור.");
            return;
          }

          var rows = [];
          var jobRows = document.querySelectorAll(".job-row");
          jobRows.forEach(function (row) {
            var jobType = (
              row.querySelector(".job-type") || { value: "" }
            ).value.trim();
            var department = (
              row.querySelector(".job-department") || { value: "" }
            ).value.trim();
            var amount = (
              row.querySelector(".job-amount") || { value: "" }
            ).value.trim();
            var paymentMode = (
              row.querySelector(".job-payment") || { value: "" }
            ).value.trim();
            var notes = (
              row.querySelector(".job-notes") || { value: "" }
            ).value.trim();
            var activeBtn = row.querySelector(".job-active-toggle");
            var rowActive = activeBtn
              ? activeBtn.getAttribute("data-active") === "true"
              : true;
            var rowIndex = row.getAttribute("data-row-index") || null;

            var allEmpty =
              !jobType && !department && !amount && !paymentMode && !notes;
            if (allEmpty) return;

            rows.push({
              rowIndex: rowIndex,
              rowActive: rowActive,
              jobType: jobType,
              department: department,
              amount: amount,
              paymentMode: paymentMode,
              notes: notes,
            });
          });

          if (!rows.length) {
            alert("לפחות סוג עבודה אחד חייב להיות מוגדר.");
            return;
          }

          var payload = {
            payload: {
              id: String(idEl.value),
              name:
                (document.getElementById("employee-name") || { value: "" })
                  .value || "",
              email:
                (document.getElementById("employee-email") || { value: "" })
                  .value || "",
              phone:
                (document.getElementById("employee-phone") || { value: "" })
                  .value || "",
              idNumber:
                (document.getElementById("employee-idnum") || { value: "" })
                  .value || "",
              gender:
                (document.getElementById("employee-gender") || { value: "" })
                  .value || "",
              birthdate:
                (document.getElementById("employee-birthdate") || { value: "" })
                  .value || "",
              shirtSize:
                (document.getElementById("employee-shirt") || { value: "" })
                  .value || "",
              travelCost:
                (document.getElementById("employee-travel") || { value: "" })
                  .value || "",
              rows: rows,
            },
          };

          google.script.run
            .withFailureHandler(function (err) {
              alert("שמירת העובד נכשלה: " + err);
            })
            .withSuccessHandler(function (response) {
              dialogState.lastResponse = response || null;
              if (!response) {
                alert("לא התקבלה תשובה מהשרת לאחר שמירה.");
                return;
              }

              if (response.errors && response.errors.length) {
                renderEmployeeView(response);
                return;
              }

              renderEmployeeView(response);
            })
            .UI_saveEmployeeDialogChanges(payload);
        }

        function setBodyLoading(text) {
          var body = document.getElementById("dialog-body");
          if (!body) return;
          body.innerHTML = "";
          var box = document.createElement("div");
          box.className = "placeholder";
          box.textContent = text || "טוען...";
          body.appendChild(box);
        }

        function renderError(message) {
          var body = document.getElementById("dialog-body");
          if (!body) return;
          body.innerHTML = "";
          var box = document.createElement("div");
          box.className = "dialog-errors";
          var line = document.createElement("div");
          line.textContent = message;
          box.appendChild(line);
          body.appendChild(box);
        }

        // ----- Requests (new tab) -----
        function loadRequestsDialogData(filters) {
          var params = Object.assign(
            {},
            dialogState.params || {},
            filters || {}
          );
          setBodyLoading("טוען נתוני בקשות...");

          google.script.run
            .withFailureHandler(function (err) {
              renderError("שגיאה בטעינת הבקשות: " + err);
            })
            .withSuccessHandler(function (response) {
              dialogState.lastResponse = response || null;
              renderRequestsView(response || {});
            })
            .UI_getRequestsDialogData(params);
        }

        function renderRequestsView(response) {
          var body = document.getElementById("dialog-body");
          if (!body) return;
          body.innerHTML = "";

          var errors = (response && response.errors) || [];
          var data = (response && response.data) || null;
          var meta = (response && response.meta) || {};

          if (errors.length) {
            var errBox = document.createElement("div");
            errBox.className = "dialog-errors";
            errors.forEach(function (err) {
              var line = document.createElement("div");
              line.textContent = err && err.message ? err.message : String(err);
              errBox.appendChild(line);
            });
            body.appendChild(errBox);
          }

          if (!data) {
            var info = document.createElement("div");
            info.className = "placeholder";
            info.textContent = "לא נמצאו נתוני בקשות.";
            body.appendChild(info);
            return;
          }

          // Refresh state
          requestsState.filters = data.filtersEcho || {};
          requestsState.requests = data.requests || [];
          requestsState.employees = data.employeesLookup || [];
          requestsState.statuses = data.statuses || [];
          requestsState.requestTypes = data.requestTypes || [];
          requestsState.rules = data.rules || {};
          requestsState.canEdit = meta.canEdit !== false;

          if (!requestsState.selectedId && requestsState.requests.length) {
            requestsState.selectedId = requestsState.requests[0].id || "";
          }

          var filtersRow = document.createElement("div");
          filtersRow.className = "filters-row";

          filtersRow.appendChild(
            wrapField(
              "מתאריך",
              createInputWithValue(
                "req-from-date",
                "date",
                requestsState.filters.fromDate || ""
              )
            )
          );
          filtersRow.appendChild(
            wrapField(
              "עד תאריך",
              createInputWithValue(
                "req-to-date",
                "date",
                requestsState.filters.toDate || ""
              )
            )
          );
          filtersRow.appendChild(
            wrapField(
              "עובד",

            "",

            tr.appendChild(tdCheck);

            [

              r.employeeName || r.employeeId || "",
              r.requestType || "",

        function readCurrentRequestFilters() {
          var statusesSel = document.getElementById("req-filter-statuses");
          var statusList = [];
          if (statusesSel && statusesSel.options) {
            Array.prototype.forEach.call(statusesSel.options, function (opt) {
              if (opt.selected && opt.value) statusList.push(opt.value);
            });
          }

          return {
            fromDate: (
              document.getElementById("req-from-date") || { value: "" }
            ).value,
            toDate: (document.getElementById("req-to-date") || { value: "" })
              .value,
            employeeId: (
              document.getElementById("req-filter-employee") || { value: "" }
            ).value,
            requestType: (
              document.getElementById("req-filter-requestType") || { value: "" }
            ).value,
            statuses: statusList,
            includeCancelled: !!(
              document.getElementById("req-include-cancelled") || {
                checked: false,
              }
            ).checked,
          };
        }

        function buildStatusMultiSelect(id, statuses, selectedValues) {
          var select = document.createElement("select");
          select.id = id;
          select.multiple = true;
          var selectedSet = {};
          (selectedValues || []).forEach(function (v) {
            selectedSet[v] = true;
          });
          (statuses || []).forEach(function (s) {
            var value = s && s.value !== undefined ? s.value : s;
            var label = s && s.label !== undefined ? s.label : value;
            var opt = document.createElement("option");
            opt.value = value || "";
            opt.textContent = label || value || "";
            if (selectedSet[opt.value]) opt.selected = true;
            select.appendChild(opt);
          });
          return select;
        }

        function buildRequestTypeSelect(id, types, selected) {
          var select = document.createElement("select");
          select.id = id;
          var optEmpty = document.createElement("option");
          optEmpty.value = "";
          optEmpty.textContent = "-- סוג בקשה --";
          select.appendChild(optEmpty);
          (types || []).forEach(function (t) {
            var value = t && t.value !== undefined ? t.value : t;
            var label = t && t.label !== undefined ? t.label : value;
            var opt = document.createElement("option");
            opt.value = value || "";
            opt.textContent = label || value || "";
            if (selected && selected === opt.value) opt.selected = true;
            select.appendChild(opt);
          });
          return select;
        }

        function toggleRequestSelection(requestId, checked) {
          if (!requestId) return;
          if (checked) {
            requestsState.selection[requestId] = true;
          } else {
            delete requestsState.selection[requestId];
          }
          renderRequestsView({
            data: {
              filtersEcho: requestsState.filters,
              requests: requestsState.requests,
              employeesLookup: requestsState.employees,
              requestTypes: requestsState.requestTypes,
              statuses: requestsState.statuses,
              rules: requestsState.rules,
            },
            meta: { canEdit: requestsState.canEdit },
            errors: [],
          });
        }

        function saveSingleRequest(current) {
          if (!current || !current.id) return;
          var statusVal = (
            document.getElementById("req-status") || { value: "" }
          ).value;
          var managerNote = (
            document.getElementById("req-manager-notes") || { value: "" }
          ).value;
          if (!statusVal) {
            alert("יש לבחור סטטוס לשמירה.");
            return;
          }

          var payload = {
            requestId: current.id,
            status: statusVal,
            managerNotes: managerNote,
            employeeId: current.employeeId || "",
            jobId: current.jobId || "",
            fixDate: current.fromDate || current.toDate || "",
            direction: current.requestType || "",
          };

          google.script.run
            .withFailureHandler(function (err) {
              alert("שמירת הבקשה נכשלה: " + err);
            })
            .withSuccessHandler(function (res) {
              requestsState.message = summaryMessageFromSave(res);
              loadRequestsDialogData(requestsState.filters);
            })
            .UI_saveRequestChanges({
              request: payload,
              rules: requestsState.rules,
            });
        }

        function applyBulkAction() {
          var action = (
            document.getElementById("req-bulk-action") || { value: "" }
          ).value;
          var statusVal = (
            document.getElementById("req-bulk-status") || { value: "" }
          ).value;
          var selectedIds = Object.keys(requestsState.selection).filter(
            function (id) {
              return requestsState.selection[id];
            }
          );

          if (!selectedIds.length) {
            alert("לא נבחרו בקשות.");
            return;
          }
          if (action !== "set-status" || !statusVal) {
            alert("בחר פעולה וסטטוס לעדכון.");
            return;
          }

          var requestMap = {};
          (requestsState.requests || []).forEach(function (r) {
            requestMap[r.id] = r;
          });

          var updates = selectedIds.map(function (id) {
            var base = requestMap[id] || {};
            return {
              requestId: id,
              status: statusVal,
              employeeId: base.employeeId || "",
              jobId: base.jobId || "",
              fixDate: base.fromDate || base.toDate || "",
              direction: base.requestType || "",
            };
          });

          google.script.run
            .withFailureHandler(function (err) {
              alert("שמירת הבקשות נכשלה: " + err);
            })
            .withSuccessHandler(function (res) {
              requestsState.message = summaryMessageFromSave(res);
              loadRequestsDialogData(requestsState.filters);
            })
            .UI_saveRequestChanges({
              requests: updates,
              rules: requestsState.rules,
            });
        }

        function summaryMessageFromSave(res) {
          if (!res) return "";
          var errors = (res && res.errors) || [];
          var saves =
            res && res.data && res.data.saveResults
              ? res.data.saveResults.length
              : 0;
          if (errors.length && !saves) {
            return (
              "שמירה נכשלה: " + (errors[0].message || errors[0].code || "")
            );
          }
          if (errors.length && saves) {
            return (
              "חלק מהשמירות הצליחו (" +
              saves +
              ") וחלק נכשלו (" +
              errors.length +
              ")."
            );
          }
          if (saves) return "נשמרו " + saves + " בקשות.";
          return "";
        }

        function buildJobSelect(id, jobs, selected) {

            var opt = document.createElement("option");
            opt.value = j.id || j.name || "";
            opt.textContent = j.name || j.id || "";
            if (j.isActive === false) opt.textContent += " (לא פעיל)";
            if (selected && (selected === opt.value || selected === j.name)) {
              opt.selected = true;
            }
            select.appendChild(opt);
          });
          return select;
        }

        function readCurrentShiftFilters() {
          return {
            fromDate: (document.getElementById("from-date") || { value: "" })
              .value,
            toDate: (document.getElementById("to-date") || { value: "" }).value,
            employeeId: (
              document.getElementById("filter-employee") || { value: "" }
            ).value,
            status: (document.getElementById("filter-status") || { value: "" })
              .value,
          };
        }

        function populateShiftForm(shift, employeesLookup, jobTypesLookup) {
          var idEl = document.getElementById("shift-id");
          var empEl = document.getElementById("shift-employee");
          var jobEl = document.getElementById("shift-job");
          var dateEl = document.getElementById("shift-date");
          var startEl = document.getElementById("shift-start");
          var endEl = document.getElementById("shift-end");
          var statusEl = document.getElementById("shift-status");
          var deptEl = document.getElementById("shift-dept");
          var noteEl = document.getElementById("shift-note");

          if (!shift) {
            if (idEl) idEl.value = "";
            if (empEl) empEl.value = "";
            if (jobEl) jobEl.value = "";
            if (dateEl) dateEl.value = "";
            if (startEl) startEl.value = "";
            if (endEl) endEl.value = "";
            if (statusEl) statusEl.value = "";
            if (deptEl) deptEl.value = "";
            if (noteEl) noteEl.value = "";
            return;
          }

          if (idEl) idEl.value = shift.id || "";

          if (empEl) {
            var empId = shift.employeeId || "";
            var hasEmp = (employeesLookup || []).some(function (e) {
              return e.id === empId;
            });
            empEl.value = hasEmp ? empId : "";
          }

          if (jobEl) {
            var jid = shift.jobId || shift.workTypeId || shift.jobName || "";
            var matchedJob = (jobTypesLookup || []).find(function (j) {
              return j.id === jid || j.name === jid || j.name === shift.jobName;
            });
            jobEl.value = matchedJob
              ? matchedJob.id || matchedJob.name || ""
              : jid;
          }

          if (dateEl) dateEl.value = shift.rawDate || shift.logicalDate || "";
          if (startEl) startEl.value = shift.startTime || "";
          if (endEl) endEl.value = shift.endTime || "";
          if (statusEl) statusEl.value = shift.status || "";
          if (deptEl) deptEl.value = shift.department || "";
          if (noteEl) noteEl.value = shift.manualNote || "";
        }

        function saveShiftFromForm(filtersEcho) {
          var payload = {
            id: (document.getElementById("shift-id") || { value: "" }).value,
            employeeId: (
              document.getElementById("shift-employee") || { value: "" }
            ).value,
            jobId: (document.getElementById("shift-job") || { value: "" })
              .value,
            jobName:
              document.getElementById("shift-job") &&
              document.getElementById("shift-job").selectedOptions &&
              document.getElementById("shift-job").selectedOptions[0]
                ? document
                    .getElementById("shift-job")
                    .selectedOptions[0].textContent.replace(" (לא פעיל)", "")
                : "",
            date: (document.getElementById("shift-date") || { value: "" })
              .value,
            startTime: (document.getElementById("shift-start") || { value: "" })
              .value,
            endTime: (document.getElementById("shift-end") || { value: "" })
              .value,
            status: (document.getElementById("shift-status") || { value: "" })
              .value,
            department: (document.getElementById("shift-dept") || { value: "" })
              .value,
            manualNote: (document.getElementById("shift-note") || { value: "" })
              .value,
          };

          google.script.run
            .withFailureHandler(function (err) {
              alert("שמירת המשמרת נכשלה: " + err);
            })
            .withSuccessHandler(function (response) {
              dialogState.lastResponse = response || null;
              if (!response) {
                alert("לא התקבלה תשובה לאחר שמירה.");
                return;
              }
              renderShiftsView(response);
            })
            .UI_saveShiftChanges({ payload: payload, filters: filtersEcho });
        }
      })();
    </script>
  </body>
</html>
